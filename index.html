<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon-1024.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071322" />
    <meta name="description" content="Organiza+: pedidos e cozinha em tempo real para pequenos negócios de comida de rua." />
    <title>Organiza+</title>
    <script>
      // Aplica o tema salvo antes do primeiro desenho, para a tela não piscar.
      try {
        if (localStorage.getItem('organiza-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#F7F5F2';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
