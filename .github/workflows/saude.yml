name: Saúde do sistema

# A cada 6 horas: o site responde, o banco responde e está na versão que o
# código espera. Se algo falhar, o GitHub manda e-mail para quem cuida do
# repositório. A chamada ao banco também evita que o Supabase Free pause
# sozinho por falta de uso (aconteceu em 14/10).
#
# Configurar uma vez em Settings > Secrets and variables > Actions:
#   Variables: SITE_URL (ex.: https://organizaplus.vercel.app) e SUPABASE_URL
#   Secrets:   SUPABASE_ANON_KEY (a chave publishable, a mesma do site)
# Sem elas, o workflow só avisa que falta configurar e termina verde.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Conferir configuração
        id: config
        run: |
          if [[ -z "$SITE_URL" || -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::notice::Configure SITE_URL, SUPABASE_URL e SUPABASE_ANON_KEY para ligar a verificação de saúde."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Site no ar
        if: steps.config.outputs.pronto == 'sim'
        run: |
          CODIGO=$(curl -s -o pagina.html -w '%{http_code}' --max-time 20 "$SITE_URL/")
          echo "Site respondeu $CODIGO"
          test "$CODIGO" = "200"
          grep -q 'id="root"' pagina.html || { echo "::error::O endereço respondeu, mas não é o Organiza+."; exit 1; }

      - name: Banco no ar e na versão certa
        if: steps.config.outputs.pronto == 'sim'
        run: |
          ESPERADA=$(grep -oE '[0-9]{8}' src/lib/versaoDoBanco.js | head -1)
          VERSAO=$(curl -s --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/versao_do_banco" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' -d '{}')
          echo "Banco na versão $VERSAO (o código espera $ESPERADA)"
          if ! [[ "$VERSAO" =~ ^[0-9]+$ ]]; then
            echo "::error::O banco não respondeu. Pode ter pausado: abra o painel do Supabase e clique em Restore."
            exit 1
          fi
          if (( VERSAO < ESPERADA )); then
            echo "::error::O banco está atrás do código. Rode os arquivos de supabase/migracoes que faltam."
            exit 1
          fi
