name: Verificação

# Roda em todo PR para dev ou main: lint, testes do front, testes do banco
# (schema.sql num Postgres local), build e testes de tela. Se algo quebrar, o PR mostra em
# vermelho antes de alguém aprovar.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes do front
        run: npm test

      - name: Testes do banco
        run: npm run test:banco

      - name: Build
        run: npm run build

  # Job separado: baixar o navegador às vezes demora (servidor do GitHub lento)
  # e não pode derrubar as outras verificações nem estourar o tempo delas.
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Ver a versão do Playwright
        id: playwright
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # O navegador fica guardado entre execuções; só baixa de novo quando a
      # versão do Playwright muda.
      - name: Navegador guardado
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}

      - name: Baixar o navegador
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps --only-shell chromium

      - name: Instalar as bibliotecas do navegador
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install-deps chromium

      - name: Testes de tela (fluxo e acessibilidade)
        timeout-minutes: 10
        run: npm run test:e2e
